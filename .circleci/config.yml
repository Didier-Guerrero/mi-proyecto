version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/python:3.12  # Usa imagen con Python preinstalado

    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"

    steps:
      - checkout

      - run:
          name: Verificar instalación de Python
          command: |
            python --version
            pip --version

      - run:
          name: Crear entorno virtual e instalar dependencias
          command: |
            python -m venv venv
            . venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Ejecutar pruebas y generar cobertura
          command: |
            . venv/bin/activate
            pytest --maxfail=1 --disable-warnings --cov=app --cov-report=xml --html=pytest_report.html --self-contained-html

      - run:
          name: Análisis de calidad del código
          command: |
            . venv/bin/activate
            flake8 app --format=html --htmldir=flake-report || true
            pylint app > pylint-report.txt || true

      - run:
          name: Escaneo de seguridad
          command: |
            . venv/bin/activate
            bandit -r app -f txt -o bandit-report.txt || true

      - store_artifacts:
          path: pytest_report.html
          destination: pytest_report.html

      - store_artifacts:
          path: flake-report
          destination: flake-report

      - store_artifacts:
          path: pylint-report.txt
          destination: pylint-report.txt

      - store_artifacts:
          path: bandit-report.txt
          destination: bandit-report.txt

      - store_test_results:
          path: .
          when: always

workflows:
  version: 2
  pipeline:
    jobs:
      - build_and_test
